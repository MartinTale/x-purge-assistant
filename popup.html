<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Purge Assistant</h1>
    </header>
    <label class="row-field">
      Your X handle
      <input id="owner" type="text" placeholder="handle" autocomplete="off" />
    </label>
    <label class="interval">
      Open a random account
      <select id="interval">
        <option value="0">Never</option>
        <option value="15">Every 15 min</option>
        <option value="30">Every 30 min</option>
        <option value="60">Every hour</option>
        <option value="120">Every 2 hours</option>
        <option value="240">Every 4 hours</option>
        <option value="1440">Every day</option>
      </select>
    </label>
    <button id="pause" type="button" hidden></button>
    <p id="status" hidden>Enter your handle, then open your following page and scroll to collect accounts.</p>
    <p id="stats"></p>
    <ul id="list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
